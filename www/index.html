<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>yuanbing for Android</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>

<script>
window.onerror = function (msg, src, line, col, err) {
  try {
    if (window.Native && Native.log) {
      Native.log('JSERR ' + msg + ' @' + src + ':' + line + (err && err.stack ? '\n' + err.stack : ''));
    }
  } catch (e) {}
  return false;
};
</script>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="nightShade" aria-hidden="true"></div>

<div id="stage" aria-hidden="true">
  <div id="ball">
    <div id="glow"></div>
    <div id="boop">
      <div id="squash">
        <div id="host"></div>
        <div id="acc"></div>
      </div>
    </div>
    <div id="bubble"></div>
  </div>
</div>

<div id="fx" aria-hidden="true"></div>
<div id="widget" aria-hidden="true"><span id="widgetTime"></span><span id="widgetDate"></span><span id="widgetBattery"></span></div>

<script src="js/rings.js"></script>
<script src="js/emotions.js"></script>
<script src="js/eyes.js"></script>
<script src="js/ball.js"></script>
<script src="js/engine.js"></script>
<script src="desk.js"></script>
</body>
</html>
